<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lector del foro del Sindicato PIDE, pensado para leerse bien en el móvil.">
  <title>Foro PIDE</title>
  <link rel="icon" href="cigena-pide.png">
  <link rel="stylesheet" href="pide.css?v=20260913">
</head>
<body>

  <div class="pide-topbar">
    <a href="https://www.sindicatopide.org/" target="_blank" rel="noopener noreferrer">
      <img src="logo-pide.png" alt="Sindicato PIDE">
      <span class="pide-topbar-title">Foro PIDE<small>Sindicato del Profesorado Extremeño</small></span>
    </a>
  </div>

  <main class="pide-shell">
    <div class="pide-header">
      <div class="pide-header-row">
        <h1>Muro del foro</h1>
        <div class="pide-toolbar">
          <button class="btn secondary" id="pideRefresh" type="button">Actualizar</button>
        </div>
      </div>
      <p class="pide-sub">
        Los mensajes del <a href="https://www.sindicatopide.org/foros/" target="_blank" rel="noopener noreferrer">foro abierto del Sindicato PIDE</a>, en formato de lectura pensado para el móvil. Es de solo lectura: para responder, abre el hilo en sindicatopide.org.
      </p>
    </div>

    <form class="pide-search-form" id="pideSearchForm">
      <input type="search" id="pideSearchInput" placeholder="Buscar en el foro…" aria-label="Buscar en el foro">
      <button class="btn primary" type="submit">Buscar</button>
      <button class="btn secondary" id="pideSearchExit" type="button" hidden>Volver al muro</button>
    </form>

    <p class="pide-status" id="pideStatus" hidden></p>

    <div class="pide-feed" id="pideFeed"></div>

    <div class="pide-load-more-row">
      <button class="btn secondary" id="pideLoadMore" type="button">Cargar hilos más antiguos</button>
    </div>
  </main>

  <button class="pide-new-pill" id="pideNewPill" type="button" hidden></button>

  <p class="pide-credit">Lector independiente, no oficial · hecho por <a href="https://mmfrutos.com/" target="_blank" rel="noopener noreferrer">Manuel M. Frutos</a></p>

  <script src="pide.js?v=20260913"></script>
</body>
</html>
